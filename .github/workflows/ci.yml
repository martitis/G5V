name: CI
on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build-lint:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn format:check
      # Fails when a $t() key is missing from the English translations.
      - run: yarn i18n
      # vue-tsc, then vite build.
      - run: yarn build
