# nginx config for the panel (static files from `yarn build`). The API URL is read at runtime from
# /config.json ({"apiUrl": "/api"} by default), so one build works for any deployment.
server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;
    root   /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # nginx drops server-level add_header lines in any location that sets its own, so the
    # security headers are repeated in each location below.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Hashed build output never changes: cache it for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Always revalidate the entry points, or browsers keep an old build (and old config).
    location ~ ^/(index\.html|config\.json|service-worker\.js)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Same-origin API (matches the default apiUrl "/api"). Live match data uses server-sent events,
    # which must not be buffered.
    # location /api/ {
    #     proxy_pass http://127.0.0.1:3301/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_http_version 1.1;
    #     proxy_buffering off;
    #     proxy_read_timeout 1h;
    #     client_max_body_size 2g;   # demo uploads
    # }

    # SPA fallback: every other path is a client-side route.
    location / {
        try_files $uri /index.html;
    }
}
